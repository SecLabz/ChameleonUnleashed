name: Push handler

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Read GitHub Pages URL
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      url: ${{ steps.pages.outputs.base_url }}/
    steps:
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
  firmware_pipeline:
    name: Build Firmware
    needs: pages
    permissions:
      contents: read
    uses: ./.github/workflows/build_firmware.yml
    with:
      publish-builder: false
      asset-base: ${{ needs.pages.outputs.url }}
      browser-tests: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
  client_pipeline:
    name: Build and test clients
    permissions:
      contents: read
    uses: ./.github/workflows/build_client.yml
  create_dev_release:
    permissions:
      contents: write
    name: Create dev pre-release with artifacts
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - firmware_pipeline
      - client_pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release-artifacts
      - name: Package versioned downloads
        run: python3 resource/tools/package_release.py --artifacts release-artifacts --output release-packages --development
      - name: Upload to dev release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release-description.txt
          tag_name: dev
          name: Development release
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: release-packages/*
      - name: Verify uploads and remove superseded downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 resource/tools/sync_release_assets.py --tag dev --archives release-packages
      - name: Fix up release tag
        run: |
          git tag -f dev
          git push origin refs/tags/dev --force
  create_release:
    permissions:
      contents: write
    name: Create tagged release with artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - firmware_pipeline
      - client_pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release-artifacts
      - name: Package versioned downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 resource/tools/package_release.py --artifacts release-artifacts --output release-packages --tag "$RELEASE_TAG"
      - name: Upload to tagged release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release-description.txt
          name: Release ${{ github.ref_name }}
          draft: false
          target_commitish: ${{ github.sha }}
          files: release-packages/*
      - name: Verify uploads and remove superseded downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 resource/tools/sync_release_assets.py --tag "$RELEASE_TAG" --archives release-packages

  deploy_pages:
    name: Deploy matching resources and firmware catalogue
    needs: [create_dev_release, create_release]
    if: always() && (needs.create_dev_release.result == 'success' || needs.create_release.result == 'success')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/mirror_firmware.yml
    with:
      resource-artifact: release-artifacts-ultra
