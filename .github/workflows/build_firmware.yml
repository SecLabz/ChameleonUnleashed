name: Firmware build

on:
  workflow_call:
    inputs:
      checkout-sha:
        required: false
        type: string
      asset-base:
        description: Resource base URL for the firmware and matching assets
        required: false
        type: string
      browser-tests:
        description: Run the complete browser suite (release tags and manual workflows)
        required: false
        type: boolean
        default: false
      publish-builder:
        description: Build and publish the firmware builder image
        required: false
        type: boolean
        default: true

jobs:
  build_fw_builder:
    name: Build fw-builder Docker image
    runs-on: ubuntu-latest # Inherits permissions from caller
    outputs:
      image_ref: ${{ steps.published-image.outputs.image_ref || steps.local-image.outputs.image_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check project version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python3 resource/tools/project_version.py --tag "$RELEASE_TAG"
      - name: ghcr.io login
        if: ${{ inputs.publish-builder }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        if: ${{ inputs.publish-builder }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-fw-builder
      - name: Build and push Docker images
        if: ${{ inputs.publish-builder }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: firmware
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Docker image for this workflow
        if: ${{ !inputs.publish-builder }}
        uses: docker/build-push-action@v7
        with:
          context: firmware
          tags: chameleonultra-fw-builder:pr
          outputs: type=docker,dest=${{ runner.temp }}/fw-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload Docker image
        if: ${{ !inputs.publish-builder }}
        uses: actions/upload-artifact@v7
        with:
          name: firmware-builder-image
          path: ${{ runner.temp }}/fw-builder.tar
          retention-days: 1
      - name: Use local builder image
        if: ${{ !inputs.publish-builder }}
        id: local-image
        run: echo "image_ref=chameleonultra-fw-builder:pr" >> "$GITHUB_OUTPUT"
      - name: Use published builder image
        if: ${{ inputs.publish-builder }}
        id: published-image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-fw-builder
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "image_ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
  build_fw:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: build_fw_builder
    permissions:
      contents: read
    strategy:
      matrix:
        device_type: [ultra]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download Docker image
        if: ${{ !inputs.publish-builder }}
        uses: actions/download-artifact@v8
        with:
          name: firmware-builder-image
          path: ${{ runner.temp }}
      - name: Load Docker image
        if: ${{ !inputs.publish-builder }}
        run: docker load --input "${{ runner.temp }}/fw-builder.tar"
      - name: Read shared library revision
        id: shared
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path('software/web/build-lock.json').read_text())
          print('revision=' + lock['shared']['revision'])
          print('rust=' + lock['rust'])
          PY
      - name: Check out shared NFC libraries
        uses: actions/checkout@v7
        with:
          repository: SecLabz/nfc-libs-rs
          ref: ${{ steps.shared.outputs.revision }}
          path: .cache/web/shared
          persist-credentials: false
      - name: Build web assets and USB dependencies
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.shared.outputs.rust }}
          ASSET_BASE: ${{ inputs.asset-base }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy zopfli
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          asset_options=()
          if [[ -n "$ASSET_BASE" ]]; then
            asset_options=(--asset-base "$ASSET_BASE")
          fi
          python3 resource/tools/build_web.py --prepare-deps --zopfli --shared-source .cache/web/shared "${asset_options[@]}"
      - name: Package matching CDN resources
        run: python3 resource/tools/package_cdn.py --shared-source .cache/web/shared
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check and test the native CLI
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.shared.outputs.rust }}
        run: |
          cargo fmt --manifest-path software/Cargo.toml --all -- --check
          cargo clippy --manifest-path software/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path software/Cargo.toml --workspace --locked
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install hardware test dependency
        run: python3 -m pip install pyserial==3.5 cryptography==43.0.3
      - name: Check web interface and host fixtures
        run: |
          npm ci --prefix software/web
          npm run check --prefix software/web
          npm test --prefix software/web
          python3 -m unittest discover -s resource/tools -p 'test_*.py' -v
      - name: Test web interface in browsers
        if: ${{ inputs.browser-tests }}
        run: |
          npm exec --prefix software/web -- playwright install --with-deps chromium webkit
          npm run test:browser --prefix software/web
      - name: Build firmware
        run: |
          docker run --rm -v ${PWD}:/workdir -e CURRENT_DEVICE_TYPE=${{ matrix.device_type }} "${{ needs.build_fw_builder.outputs.image_ref }}" firmware/build.sh
      - name: Upload built binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device_type }}-firmware
          path: |
            firmware/objects/*.hex
            firmware/objects/THIRD_PARTY.txt
      - name: Prepare release artifacts
        run: |
          sudo chown -R $USER:$USER firmware/objects
          cp .cache/web/chameleon-unleashed-cdn.zip firmware/objects/chameleon-unleashed-cdn.zip
          mkdir firmware/objects/chameleon-unleashed-app
          mkdir firmware/objects/chameleon-unleashed-full
          unzip firmware/objects/chameleon-unleashed-app.zip -d firmware/objects/chameleon-unleashed-app
          unzip firmware/objects/chameleon-unleashed-full.zip -d firmware/objects/chameleon-unleashed-full
      - name: Upload dfu app image
        uses: actions/upload-artifact@v7
        with:
          name: chameleon-unleashed-app
          path: firmware/objects/chameleon-unleashed-app/*
      - name: Upload dfu full image
        uses: actions/upload-artifact@v7
        with:
          name: chameleon-unleashed-full
          path: firmware/objects/chameleon-unleashed-full/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.device_type }}
          path: |
            firmware/objects/chameleon-unleashed-app.zip
            firmware/objects/chameleon-unleashed-install.zip
            firmware/objects/chameleon-unleashed-bootloader.zip
            firmware/objects/chameleon-unleashed-full.zip
            firmware/objects/chameleon-unleashed-binaries.zip
            firmware/objects/chameleon-unleashed-cdn.zip
          if-no-files-found: error
