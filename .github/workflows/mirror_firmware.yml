name: Deploy web resources and firmware catalogue

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      resource-artifact:
        description: Matching firmware build artifact from the calling run
        required: false
        type: string
        default: ''
  release:
    types: [published]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release events can point at older tags lacking the deployment tools.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - name: Read existing resources without changing gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .cache/baseline
          persist-credentials: false
      - name: Download matching build resources
        if: inputs.resource-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.resource-artifact }}
          path: .cache/current-build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install signature verifier
        run: python -m pip install cryptography==43.0.3
      - name: Rebuild resources and the latest five compatible stable releases per source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOURCE_ARTIFACT: ${{ inputs.resource-artifact }}
        run: |
          options=()
          if [[ -n "$RESOURCE_ARTIFACT" ]]; then
            options=(--resource-archive .cache/current-build/chameleon-unleashed-cdn.zip)
          fi
          python resource/tools/prepare_pages.py --output .cache/site --baseline .cache/baseline "${options[@]}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/site
          retention-days: 1
      - name: Deploy resources and firmware catalogue
        id: deployment
        uses: actions/deploy-pages@v4
