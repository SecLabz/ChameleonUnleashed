[workspace]
members = ["rust/chameleon-client", "rust/chameleon-cli"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93.1"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
nfc-native = { git = "https://github.com/SecLabz/nfc-libs-rs", rev = "e0301a8dd320c9951d4f1ff879ff064c8e9bdf3b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
