[workspace]
members = ["rust/chameleon-client", "rust/chameleon-cli"]
resolver = "3"

[workspace.package]
version = "2.1.1"
edition = "2024"
rust-version = "1.93.1"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
nfc-native = { git = "https://github.com/SecLabz/nfc-libs-rs", rev = "09e8e93efa2048858597546aa1a457688165ac01" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
