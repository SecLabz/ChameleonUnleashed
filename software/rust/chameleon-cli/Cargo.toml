[package]
name = "chameleon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chameleon"
path = "src/main.rs"

[dependencies]
chameleon-client = { path = "../chameleon-client" }
nfc-native.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "6.0.0"
reedline = "0.48.0"
nu-ansi-term = "0.50.3"
crossterm = { version = "0.29.0", default-features = false }
shlex = "2.0.1"
serde_json.workspace = true
unicode-width = "0.2.2"
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
