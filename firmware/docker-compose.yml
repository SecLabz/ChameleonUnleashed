# How to use this docker-compose.yml file:
# ========================================
# 1. Install [Docker](https://www.docker.com/)
# 2. Prepare web assets and dependencies using software/web/README.md.
#    Change the current directory to the `firmware/` directory.
# 3. Run `docker compose up --pull=always build-ultra` to build the firmware for the ChameleonUltra
# 4. The firmware will be available in the `firmware/objects/` directory.
# 5. Install the firmware `chameleon-unleashed-app.zip` (in DFU mode).
services:
  build-ultra:
    image: ghcr.io/rfidresearchgroup/chameleonultra-fw-builder:main
    platform: linux/amd64
    volumes:
      - '../:/workdir:rw'
    environment:
      CURRENT_DEVICE_TYPE: ultra
    command: bash ./firmware/build.sh
